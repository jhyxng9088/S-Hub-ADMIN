name: Patch push subscription status

on:
  push:
    paths:
      - '.github/workflows/patch-push-status.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin UI
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/main.jsx')
          text = path.read_text()

          old = "  const [classFilter, setClassFilter] = useState('all')\n  const [selectedUser, setSelectedUser] = useState(null)"
          new = "  const [classFilter, setClassFilter] = useState('all')\n  const [pushFilter, setPushFilter] = useState('all')\n  const [selectedUser, setSelectedUser] = useState(null)"
          if old not in text:
            raise SystemExit('state anchor missing')
          text = text.replace(old, new, 1)

          old = "  const filteredUsers = useMemo(() => { if (!data) return []; const needle = queryText.trim().toLocaleLowerCase('ko'); return data.users.filter((user) => { if (classFilter !== 'all' && user.classId !== classFilter) return false; if (!needle) return true; return [user.name, user.classNumber, user.studentNumber, user.uid, user.studentKey].some((value) => String(value || '').toLocaleLowerCase('ko').includes(needle)) }) }, [data, queryText, classFilter])"
          new = "  const filteredUsers = useMemo(() => { if (!data) return []; const needle = queryText.trim().toLocaleLowerCase('ko'); return data.users.filter((user) => { if (classFilter !== 'all' && user.classId !== classFilter) return false; if (pushFilter === 'enabled' && !(user.pushDevices > 0)) return false; if (pushFilter === 'disabled' && user.pushDevices > 0) return false; if (!needle) return true; return [user.name, user.classNumber, user.studentNumber, user.uid, user.studentKey].some((value) => String(value || '').toLocaleLowerCase('ko').includes(needle)) }) }, [data, queryText, classFilter, pushFilter])"
          if old not in text:
            raise SystemExit('filter anchor missing')
          text = text.replace(old, new, 1)

          old = "function StudentList({ users, onSelect }) {\n  return <div className=\"student-list\">{users.length ? users.map((user) => <button className=\"student-row detailed\" key={user.studentKey || user.uid} onClick={() => onSelect(user)}><span className={`presence-dot ${user.online ? 'online' : ''}`}/><span className=\"student-main\"><strong>{user.name}</strong><small>{user.grade ? `${user.grade}학년 · ` : ''}{user.classNumber ? `${user.classNumber}반` : '반 미상'} · {user.studentNumber ? `${user.studentNumber}번` : '번호 미수집'}</small></span><span className=\"student-activity\"><b>{user.activity7d || 0}</b><small>7일 수정</small></span><span className=\"student-meta\"><small>{relativeTime(user.effectiveLastSeenAt)}</small>{user.identityCount > 1 ? <em>{user.identityCount}기기</em> : null}{user.status !== 'active' ? <b>비활성</b> : null}</span></button>) : <div className=\"empty-state\">조건에 맞는 학생이 없어.</div>}</div>\n}"
          new = "function StudentList({ users, onSelect }) {\n  return <div className=\"student-list\">{users.length ? users.map((user) => <button className=\"student-row detailed\" key={user.studentKey || user.uid} onClick={() => onSelect(user)}><span className={`presence-dot ${user.online ? 'online' : ''}`}/><span className=\"student-main\"><strong>{user.name}<span className={`push-badge ${user.pushDevices > 0 ? 'enabled' : 'disabled'}`}>{user.pushDevices > 0 ? `알림 구독 · ${user.pushDevices}기기` : '알림 미구독'}</span></strong><small>{user.grade ? `${user.grade}학년 · ` : ''}{user.classNumber ? `${user.classNumber}반` : '반 미상'} · {user.studentNumber ? `${user.studentNumber}번` : '번호 미수집'}</small></span><span className=\"student-activity\"><b>{user.activity7d || 0}</b><small>7일 수정</small></span><span className=\"student-meta\"><small>{relativeTime(user.effectiveLastSeenAt)}</small>{user.identityCount > 1 ? <em>{user.identityCount}기기</em> : null}{user.status !== 'active' ? <b>비활성</b> : null}</span></button>) : <div className=\"empty-state\">조건에 맞는 학생이 없어.</div>}</div>\n}"
          if old not in text:
            raise SystemExit('student list anchor missing')
          text = text.replace(old, new, 1)

          old = "<select value={classFilter} onChange={(event) => setClassFilter(event.target.value)}><option value=\"all\">전체 반</option>{data.classes.map((row) => <option key={row.classId} value={row.classId}>{row.grade ? `${row.grade}학년 ` : ''}{row.classNumber ? `${row.classNumber}반` : row.classId}</option>)}</select></div><div className=\"student-result-meta\">{filteredUsers.length}명 · 7일 활동/최근 접속/연결 계정 표시</div>"
          new = "<select value={classFilter} onChange={(event) => setClassFilter(event.target.value)}><option value=\"all\">전체 반</option>{data.classes.map((row) => <option key={row.classId} value={row.classId}>{row.grade ? `${row.grade}학년 ` : ''}{row.classNumber ? `${row.classNumber}반` : row.classId}</option>)}</select><select value={pushFilter} onChange={(event) => setPushFilter(event.target.value)}><option value=\"all\">알림 전체</option><option value=\"enabled\">알림 구독</option><option value=\"disabled\">알림 미구독</option></select></div><div className=\"student-result-meta\">{filteredUsers.length}명 · 알림 구독 {filteredUsers.filter((user) => user.pushDevices > 0).length}명 · 미구독 {filteredUsers.filter((user) => !(user.pushDevices > 0)).length}명</div>"
          if old not in text:
            raise SystemExit('toolbar anchor missing')
          text = text.replace(old, new, 1)

          old = "<MetricCard label=\"푸시 등록\" value={metrics.pushEnabled} detail={`${percent(metrics.pushEnabled, metrics.total)} 학생`}/>"
          new = "<MetricCard label=\"푸시 등록\" value={metrics.pushEnabled} detail={`${percent(metrics.pushEnabled, metrics.total)} 학생 · 미구독 ${Math.max(0, (metrics.total || 0) - (metrics.pushEnabled || 0))}명`}/>"
          if old not in text:
            raise SystemExit('metric anchor missing')
          text = text.replace(old, new, 1)

          path.write_text(text)

          css = Path('src/admin-extra.css')
          css_text = css.read_text()
          marker = '/* push-subscription-status */'
          if marker not in css_text:
            css_text += '''\n\n/* push-subscription-status */\n.student-main strong{display:flex;align-items:center;gap:8px;flex-wrap:wrap}\n.push-badge{display:inline-flex;align-items:center;min-height:20px;padding:3px 7px;border-radius:999px;font-size:9px;font-weight:750;line-height:1;letter-spacing:-.01em}\n.push-badge.enabled{color:#64e6a1;background:rgba(57,217,138,.12);border:1px solid rgba(57,217,138,.2)}\n.push-badge.disabled{color:#ffb25c;background:rgba(255,159,67,.11);border:1px solid rgba(255,159,67,.2)}\n.student-toolbar select{min-width:112px}\n@media(max-width:560px){.student-toolbar{display:grid;grid-template-columns:1fr 1fr}.student-toolbar .search-box{grid-column:1/-1}.push-badge{font-size:8px}}\n'''
            css.write_text(css_text)
          PY
      - name: Commit patch
        run: |
          git config user.name "jhyxng9088"
          git config user.email "j.hyxng9088@gmail.com"
          git add src/main.jsx src/admin-extra.css
          git diff --cached --quiet && exit 0
          git commit -m "Show student push subscription status and filters"
          git push
